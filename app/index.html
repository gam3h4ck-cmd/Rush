<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rush">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%2314161b'/%3E%3Cpath d='M136.10,166.90 L334.10,166.90 L309.90,208.70 L111.90,208.70Z' fill='%23ff5a1f' fill-opacity='1'/%3E%3Cpath d='M191.10,235.10 L422.10,235.10 L397.90,276.90 L166.90,276.90Z' fill='%23ff7d4d' fill-opacity='1'/%3E%3Cpath d='M114.10,303.30 L279.10,303.30 L254.90,345.10 L89.90,345.10Z' fill='%23ffa27c' fill-opacity='1'/%3E%3C/svg%3E">
<title>Rush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght,SOFT,WONK@1,9..144,900,0,0&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: intestazione chiara con il marchio e una bordura a quadretti da tovaglia; superficie color mozzarella; i turni sono comande colorate per reparto */
  --bg:#faf7f1; --surface:#ffffff; --ink:#2b2420; --muted:#776c63; --line:#ebe3d6;
  --accent:#c8412b; --accent-ink:#ffffff; --accent-soft:#fbe8e3;
  --basil:#3d8b4f; --oil:#e0ac34;
  --warn:#946500; --warn-soft:#fdf2d2; --crit:#b42318; --crit-soft:#fde3df; --ok:#3d8b4f;
  --sala:#6f8a9c; --sala-soft:#eef2f5; --cucina:#9c7f63; --cucina-soft:#f5efe9; --bar:#9a7ea0; --bar-soft:#f3eef4;
  --t-pranzo:#3d8b4f; --t-pranzo-soft:#e8f4eb; --t-pomeriggio:#e07a1f; --t-pomeriggio-soft:#fdeedd; --t-cena:#8e2c48; --t-cena-soft:#f6e4ea; --t-altro:#5f6b7a; --t-altro-soft:#eceff3;
  --font-display:"Fraunces",Georgia,"Times New Roman",serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}
header.top{background:var(--surface);padding-top:env(safe-area-inset-top)}
.wrap{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
header.top::after{content:"";display:block;height:14px;background:linear-gradient(90deg,rgba(200,65,43,.5) 50%,transparent 0) 0 0/14px 14px,linear-gradient(rgba(200,65,43,.5) 50%,transparent 0) 0 0/14px 14px,var(--surface)}
.topbar{display:flex;align-items:center;gap:16px;padding:14px 0 8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center}
.brand h1{font-size:34px;font-weight:900;font-style:italic;letter-spacing:-.01em;line-height:1;color:var(--accent)}
.brand .venue{color:var(--muted);font-size:14px;padding-left:10px;border-left:1px solid var(--line)}
.status{margin-left:auto;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--oil)} .dot.crit{background:var(--crit)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{padding:10px 14px;text-decoration:none;color:var(--muted);font-weight:600;font-size:15px;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current="page"]{color:var(--accent);border-color:var(--accent)}
nav.tabs a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
main{padding:20px 0 48px;display:grid;gap:16px}
.banner{padding:10px 14px;border-radius:12px;background:var(--warn-soft);color:var(--ink);font-size:14px;border:1px solid var(--line)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.ph{font-size:30px;font-weight:800}
.sub2{color:var(--muted);font-size:14px}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible,.icon-btn:focus-visible,.chip:focus-visible,.add:focus-visible,.dbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:0 2px 0 #9e3020}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--crit)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{border:1px solid var(--line);background:var(--surface);width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:18px;line-height:1}
.icon-btn:hover{border-color:var(--muted)}
.weeknav{display:flex;align-items:center;gap:8px}
.weeknav h2{font-size:26px;font-weight:800;min-width:210px;line-height:1.05}
.weeknav .sub{color:var(--muted);font-size:13px;font-family:var(--font-body);font-weight:500;display:block}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--basil);border-radius:14px;padding:12px 14px}
.tile:nth-child(2){border-top-color:var(--accent)} .tile:nth-child(3){border-top-color:var(--oil)} .tile:nth-child(4){border-top-color:var(--cucina)}
.tile .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.tile .val{font-family:var(--font-display);font-size:34px;font-weight:800;line-height:1.1;margin-top:2px}
.tile .hint{font-size:13px;color:var(--muted)}
.bar{height:7px;border-radius:4px;background:var(--line);margin-top:8px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--basil);border-radius:4px}
.bar.warn>i{background:var(--oil)} .bar.crit>i{background:var(--crit)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(43,36,32,.04)}
.panel>.hd{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel>.hd h3{font-size:20px;font-weight:800}
.alerts{list-style:none;margin:0;padding:6px 0}
.alerts li{display:flex;gap:10px;align-items:baseline;padding:6px 14px;font-size:14px}
.pill{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.crit{background:var(--crit-soft);color:var(--crit)} .pill.ok{background:var(--sala-soft);color:var(--basil)} .pill.mute{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.empty{padding:32px;text-align:center;color:var(--muted)}
.empty a{color:var(--accent);font-weight:700}
.gridwrap{overflow-x:auto}
table.grid{border-collapse:separate;border-spacing:0;width:100%;min-width:1080px}
table.grid th,table.grid td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top}
table.grid thead th{position:sticky;top:0;background:var(--surface);font-size:13px;text-align:left;padding:8px;font-weight:600;color:var(--muted)}
table.grid thead th .d{font-family:var(--font-display);font-size:18px;font-weight:700;color:var(--ink);display:block}
table.grid thead th.today{box-shadow:inset 0 3px 0 var(--accent)}
table.grid thead th.today .d{color:var(--accent)}
table.grid th.name,table.grid td.name{position:sticky;left:0;background:var(--surface);z-index:1;width:210px;min-width:210px;padding:8px 10px}
table.grid thead th.name{z-index:2}
tr.group td{background:var(--bg);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.12em;padding:6px 10px;color:var(--muted)}
tr.group td.name{background:var(--bg)}
tr.group.g-sala td.name,.mgroup.g-sala{color:var(--sala)} tr.group.g-cucina td.name,.mgroup.g-cucina{color:var(--cucina)} tr.group.g-bar td.name,.mgroup.g-bar{color:var(--bar)}
.person{display:flex;flex-direction:column;gap:2px}
.person b{font-weight:700}
.person .meta{font-size:12px;color:var(--muted)}
.tag{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted);margin-left:6px}
.roledot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
td.cell{padding:6px;min-width:110px;height:58px}
td.cell.warn{background:var(--warn-soft)} td.cell.crit{background:var(--crit-soft)}
.chip{display:block;width:100%;text-align:left;border:1px solid transparent;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:4px 8px;margin-bottom:4px;cursor:pointer;font-family:var(--font-mono);font-size:12.5px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.chip:hover{border-color:var(--line);border-left-color:inherit;filter:brightness(.98)}
.chip small{display:block;font-family:var(--font-body);font-weight:500;color:var(--muted);font-size:11px;letter-spacing:0}
.chip.r-sala{border-left-color:var(--sala);background:var(--sala-soft)} .chip.r-cucina{border-left-color:var(--cucina);background:var(--cucina-soft)} .chip.r-bar{border-left-color:var(--bar);background:var(--bar-soft)}
.add{display:block;width:100%;border:1px dashed var(--line);background:transparent;border-radius:8px;color:var(--muted);cursor:pointer;font-size:13px;padding:2px}
.add:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
tfoot td{padding:8px;font-size:13px;background:var(--bg);font-weight:600}
tfoot td.name{background:var(--bg);font-weight:800}
.list{width:100%;border-collapse:collapse}
.list th,.list td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:left;font-size:14px;white-space:nowrap}
.list th{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.list td.r,.list th.r{text-align:right}
.list tr:last-child td{border-bottom:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;padding:14px}
.card{border:1px solid var(--line);border-left:4px solid var(--oil);border-radius:12px;padding:12px 14px;background:var(--surface);display:grid;gap:6px}
.card h4{margin:0;font-family:var(--font-display);font-size:19px;font-weight:700;display:flex;align-items:center;gap:8px}
.form{display:grid;gap:12px;padding:14px;max-width:560px}
.field{display:grid;gap:4px}
.field label{font-size:13px;font-weight:700}
.field .help{font-size:12px;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;width:100%}
.field input[type="time"]{font-family:var(--font-mono)}
.field input:focus-visible,.field select:focus-visible,.field textarea:focus-visible{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.presets button{font-size:12px;padding:5px 10px;border-radius:999px}
.overlay{position:fixed;inset:0;background:rgba(43,36,32,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:100%;max-width:480px;box-shadow:0 20px 50px rgba(43,36,32,.25);overflow:hidden}
.modal .hd{padding:14px 16px;border-bottom:1px solid var(--line);border-top:6px solid var(--accent)}
.modal .hd h3{font-size:23px;font-weight:800}
.modal .bd{padding:16px;display:grid;gap:12px}
.modal .ft{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;background:var(--bg)}
.err{color:var(--crit);font-size:13px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:60}
.note{font-size:13px;color:var(--muted);padding:0 14px 14px;margin:0}
.note.warnnote{background:var(--warn-soft);border-radius:10px;padding:10px 14px;margin:0 14px 14px;color:var(--ink)}
.maxin{width:84px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;text-align:right;background:var(--surface)}
.maxin:focus-visible{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.list tr.over td{background:var(--crit-soft)}
.chip.t-pranzo{border-left-color:var(--t-pranzo);background:var(--t-pranzo-soft)}
.chip.t-pomeriggio{border-left-color:var(--t-pomeriggio);background:var(--t-pomeriggio-soft)}
.chip.t-cena{border-left-color:var(--t-cena);background:var(--t-cena-soft)}
.chip.t-altro{border-left-color:var(--t-altro);background:var(--t-altro-soft)}
.legend{display:grid;grid-template-columns:auto auto;justify-content:start;gap:5px 12px;font-family:var(--font-body);font-size:11.5px;font-weight:600;color:var(--ink);text-transform:none;letter-spacing:0}
.legend span{display:flex;align-items:center;gap:6px;white-space:nowrap}
.sw{display:inline-block;width:14px;height:12px;border-radius:3px;border-left:4px solid}
.sw.t-pranzo{background:var(--t-pranzo-soft);border-color:var(--t-pranzo)} .sw.t-pomeriggio{background:var(--t-pomeriggio-soft);border-color:var(--t-pomeriggio)}
.sw.t-cena{background:var(--t-cena-soft);border-color:var(--t-cena)} .sw.t-altro{background:var(--t-altro-soft);border-color:var(--t-altro)}
.overtag{display:inline-flex;align-items:center;gap:3px;color:var(--crit);font-weight:800;white-space:nowrap}
.overtag i{display:inline-grid;place-items:center;width:14px;height:14px;border-radius:50%;background:var(--crit);color:#fff;font-style:normal;font-size:10px;font-weight:800;line-height:1}
table.grid th.tot,table.grid td.tot{position:sticky;right:0;background:var(--surface);z-index:1;min-width:104px;width:104px;padding:8px 10px;text-align:right;border-left:2px solid var(--line);vertical-align:middle}
table.grid thead th.tot{z-index:2;vertical-align:top}
table.grid td.tot b{font-size:15px}
table.grid td.tot small{display:block;color:var(--muted);font-size:12px}
table.grid td.tot .overtag{margin-top:2px}
tr.group td.tot,tfoot td.tot{background:var(--bg)}
body.staffmode nav.tabs{display:none}
.pickers{display:flex;flex-wrap:wrap;gap:8px;padding:14px}
.pickers .btn{text-decoration:none}
.meday{display:grid;grid-template-columns:76px 1fr;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:start}
.meday:last-child{border-bottom:0}
.meday .day b{font-family:var(--font-display);font-size:20px;display:block;line-height:1.1}
.meday .day span{font-size:12px;color:var(--muted)}
.meday.today{background:var(--accent-soft)}
.meday.today .day b{color:var(--accent)}
.mshifts2{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.chip.static{cursor:default;margin:0;font-size:15px;padding:8px 12px;width:auto;min-width:200px}
.chip.static:hover{filter:none;border-color:transparent}
.linkcell{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.steps{margin:0;padding:12px 14px 6px 34px;display:grid;gap:6px;font-size:14px}
.actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.actions .btn{text-decoration:none;color:inherit}
.actions .btn.primary{color:var(--accent-ink)}
body.nologin nav.tabs{display:none}
.auth{max-width:440px;margin:24px auto;width:100%}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:4px;font-size:14px}
.list tr.off-row td{opacity:.6}
a.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center}
a.btn.primary{color:var(--accent-ink)}
.cellbtns{display:flex;gap:4px}
.cellbtns .add{flex:1}
.add.paste{border-style:solid;border-color:var(--oil);background:#fff7e3;color:var(--ink);font-weight:600}
.add.paste:hover{background:#ffefc7;border-color:var(--oil);color:var(--ink)}
div.chip{user-select:none;-webkit-user-select:none}
.chip[draggable="true"]{cursor:grab}
.chip.dragging{opacity:.45}
td.cell.dropping{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.dayact{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.panel>.hd .dayact{margin-top:0}
.mini{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;color:var(--muted);font-family:var(--font-body)}
.mini:hover{border-color:var(--muted);color:var(--ink)}
.mini.on{border-color:var(--oil);background:#fff7e3;color:var(--ink)}
.mini:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono)}
#clipbar{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:40;background:var(--ink);color:#fff;border-radius:999px;padding:8px 8px 8px 18px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(43,36,32,.3);width:max-content;max-width:calc(100% - 24px);font-size:14px}
#clipbar[hidden]{display:none}
#clipbar button{background:var(--oil);color:var(--ink);border:0;border-radius:999px;padding:7px 14px;font-weight:700;cursor:pointer;white-space:nowrap}
body.hasclip main{padding-bottom:96px}
body.hasclip .toast{bottom:84px}
.m-actions{display:flex;gap:8px;flex-wrap:wrap}
.daystrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dbtn{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;font-size:12px;color:var(--muted);font-weight:600}
.dbtn b{font-family:var(--font-display);font-size:22px;font-weight:800;color:var(--ink);line-height:1.05}
.dbtn small{font-size:10px;font-weight:500;font-variant-numeric:tabular-nums}
.dbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 2px 0 #9e3020}
.dbtn.on b{color:var(--accent-ink)}
.fdot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--oil)}
.mgroup{padding:7px 14px;background:var(--bg);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);border-bottom:1px solid var(--line)}
.mrow{display:grid;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
.mrow.warn{background:var(--warn-soft)} .mrow.crit{background:var(--crit-soft)}
.mshifts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mshifts .chip{width:auto;margin:0;padding:7px 10px;font-size:14px}
.mshifts .add{width:auto;padding:7px 12px;font-size:14px}
.off{color:var(--muted);font-size:14px}
.cnt{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--oil);color:var(--ink);font-size:11px;font-weight:800;margin-left:5px;vertical-align:1px}
.cbadges{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:4px}
.cbadge{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:999px;border:1px solid;white-space:nowrap;line-height:1.5}
.cbadge.off-ok{background:var(--sala-soft);border-color:var(--sala);color:#3f5868}
.cbadge.off-wait{background:var(--warn-soft);border-color:var(--oil);color:var(--warn)}
.cbadge.av-tutto{background:var(--t-pranzo-soft);border-color:var(--basil);color:var(--basil)}

.cbadge.av-cena{background:var(--t-cena-soft);border-color:var(--t-cena);color:var(--t-cena)}
.cbadge.av-no{background:var(--crit-soft);border-color:var(--crit);color:var(--crit)}
td.cell.offday{background:repeating-linear-gradient(135deg,var(--surface) 0 8px,var(--sala-soft) 8px 16px)}
.mrow.offday{background:var(--sala-soft)}
.rq{display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:start;padding:12px 14px;border-bottom:1px solid var(--line)}
.rq:last-child{border-bottom:0}
.rq-main{display:grid;gap:3px;min-width:0}

.att-in{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px}
.att-in span{background:var(--t-pranzo-soft);border:1px solid var(--basil);color:var(--basil);border-radius:999px;padding:4px 12px;font-weight:700;font-size:14px}

.att-h{display:grid;grid-template-columns:minmax(140px,1.4fr) repeat(4,minmax(70px,.7fr)) 1.2fr;gap:8px;padding:8px 14px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.att-days td,.att-days th{padding:7px 10px;font-size:14px}
.att-days{width:100%;border-collapse:collapse}
.att-days th{text-align:left;font-size:12px;color:var(--muted);font-weight:700}

.att-days tr{border-top:1px solid var(--line)}
.pt{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:2px 8px;font-family:var(--font-mono);font-size:13px;font-weight:700;cursor:pointer}
.pt.adm{border-color:var(--oil);background:#fff7e3}
.pt.miss{border-style:dashed;color:var(--crit);font-family:var(--font-body);font-weight:700}
.att-flag{display:inline-block;font-size:11px;font-weight:800;padding:1px 7px;border-radius:999px;margin:1px 2px 1px 0}
.att-flag.crit{background:var(--crit-soft);color:var(--crit)}
.att-flag.warn{background:var(--warn-soft);color:var(--warn)}
.att-flag.ok{background:var(--t-pranzo-soft);color:var(--basil)}
.kiosk{display:grid;grid-template-columns:1fr auto;gap:8px 12px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:center}
.kiosk:last-child{border-bottom:0}
.kiosk input{width:100%;font-family:var(--font-mono);font-size:12px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.bigpin{font-family:var(--font-mono);font-size:44px;letter-spacing:.2em;text-align:center;margin:6px 0}

/* ===== Rush · tema "back office" (sostituisce lo stile trattoria) ===== */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --ink:#111827; --muted:#6b7280; --line:#e5e7eb; --line2:#d1d5db;
  --accent:#ff5a1f; --accent-ink:#ffffff; --accent-soft:#fff1eb; --accent-dark:#e04812;
  --side:#14161b; --side-2:#1d2027; --side-ink:#e5e7eb; --side-muted:#8b929e;
  --basil:#16a34a; --oil:#f59e0b;
  --warn:#b45309; --warn-soft:#fef3c7; --crit:#dc2626; --crit-soft:#fee2e2; --ok:#16a34a; --ok-soft:#dcfce7;
  --sala:#2563eb; --sala-soft:#eff6ff; --cucina:#d97706; --cucina-soft:#fffbeb; --bar:#7c3aed; --bar-soft:#f5f3ff;
  --t-pranzo:#059669; --t-pranzo-soft:#ecfdf5; --t-pomeriggio:#d97706; --t-pomeriggio-soft:#fffbeb; --t-cena:#4f46e5; --t-cena-soft:#eef2ff; --t-altro:#64748b; --t-altro-soft:#f1f5f9;
  --font-display:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --radius:8px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.04);
}
body{font:14px/1.5 var(--font-body);letter-spacing:-.006em;font-feature-settings:"cv11","ss01"}
h1,h2,h3{font-family:var(--font-display);letter-spacing:-.02em}
.num,.chip,.mono{font-variant-numeric:tabular-nums}
/* intestazione scura, senza quadretti */
header.top{background:var(--side);color:var(--side-ink)}
header.top::after{display:none}
.brand .rush-mark{display:block;flex:none;margin-right:-9px}
.brand h1{font-family:"Fraunces",Georgia,"Times New Roman",serif;font-size:29px;font-weight:900;font-style:italic;font-variation-settings:"WONK" 0;letter-spacing:-.01em;line-height:1;color:#fff}

.status{color:var(--side-muted)}
.dot.warn{background:var(--oil)}

.btn{border:1px solid var(--line2);border-radius:var(--radius);padding:7px 13px;font-weight:600;font-size:13.5px;background:var(--surface);box-shadow:0 1px 2px rgba(16,24,40,.05);transition:background .12s,border-color .12s}

.tile{border:1px solid var(--line);border-top:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow)}

.bar{height:6px;border-radius:999px;background:#eef0f3}

.field input,.field select,.field textarea{border:1px solid var(--line2);border-radius:var(--radius);padding:8px 10px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.field input[type="time"]{font-family:var(--font-body);font-variant-numeric:tabular-nums}
.field input:focus-visible,.field select:focus-visible,.field textarea:focus-visible{outline:3px solid rgba(255,90,31,.18);outline-offset:0;border-color:var(--accent)}
/* finestre */

.modal{border-radius:12px;border:0;box-shadow:0 24px 48px -12px rgba(16,24,40,.25)}

.modal .ft{background:#f9fafb}
.toast{background:#111827;border-radius:var(--radius)}

.chip small{font-size:11px;color:var(--muted);font-weight:500}
.add{border-radius:6px;border-color:var(--line2)}

.add.paste:hover{background:#fde68a;border-color:var(--oil)}
.mini{border-radius:6px;font-family:var(--font-body)}
.mini.on{border-color:var(--oil);background:var(--warn-soft)}
.tag{border-radius:6px;background:#f3f4f6}
.linkcell{font-family:var(--font-mono)}
.list th{font-size:11.5px;letter-spacing:.04em;font-weight:600}
.mono{font-family:var(--font-body);font-weight:600}

.nav-ico{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.9}

.status .dot{box-shadow:0 0 0 3px rgba(255,255,255,.06)}
.weeknav h2{min-width:190px}
table.grid thead th{background:#f9fafb;font-size:12px;color:var(--muted);font-weight:500;border-bottom-color:var(--line)}

tr.group td{font-size:11px;letter-spacing:.08em;font-weight:700}
.person b{font-weight:600}
td.cell.offday{background:repeating-linear-gradient(135deg,#fff 0 7px,#f1f5f9 7px 14px)}
.meday .day b,.dbtn b{font-family:var(--font-display);letter-spacing:-.02em}
.meday.today{background:var(--accent-soft)}
.dbtn{border-radius:var(--radius)}
.dbtn.on{background:var(--side);border-color:var(--side);box-shadow:none;color:#fff}
.dbtn.on b{color:#fff}
.card{border-left:3px solid var(--oil);border-radius:10px;box-shadow:var(--shadow)}
.card h4{font-family:var(--font-display);font-size:16px;font-weight:600}
#clipbar{background:var(--side);box-shadow:0 12px 30px rgba(16,24,40,.3)}
#clipbar button{background:var(--accent);color:#fff}
.cbadge{border-radius:5px}

.att-in span{background:var(--ok-soft);border-color:#86efac;color:#15803d;border-radius:6px}

const ROLES={sala:"Sala",cucina:"Cucina",bar:"Bar"};
const STATUSES={fisso:"Fisso",studente:"Studente",indipendente:"Indipendente"};
const MONTHS_LONG=["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
const PRESETS=[["Pranzo","11:00","15:00",0],["Pomeriggio","15:00","18:00",0],["Cena","18:00","23:30",0]];
const KINDS={ferie:"Ferie",libero:"Giorno libero"};
const RSTATUS={attesa:["In attesa","warn"],approvata:["Approvata","ok"],rifiutata:["Rifiutata","crit"]};
const SLOTS={tutto:"Tutto il giorno",pranzo:"Solo pranzo",cena:"Solo cena",no:"Non disponibile"};
const SLOT_SHORT={tutto:"Tutto",pranzo:"Pranzo",cena:"Cena",no:"No"};
const DEFAULT_SETTINGS={budget:4500,studentLimit:650,maxDay:10,maxWeek:38,minRest:11,defaultPause:0,minShift:3,maxSpan:14,workDays:5,reminderHour:18};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>(crypto.randomUUID?crypto.randomUUID():"10000000-1000-4000-8000-100000000000".replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16)));
const eur=n=>new Intl.NumberFormat("it-BE",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n||0);
const hrs=n=>(Math.round((n||0)*100)/100).toLocaleString("it-BE",{maximumFractionDigits:2})+" h";
const toMin=t=>{const m=/^(\d{1,2}):(\d{2})$/.exec(t||"");return m?(+m[1])*60+(+m[2]):null};
function shiftMinutes(s){const a=toMin(s.start),b=toMin(s.end);if(a==null||b==null)return 0;let d=b-a;if(d<=0)d+=1440;return d}
function shiftHours(s){return Math.max(0,(shiftMinutes(s)-(+s.pause||0))/60)}
const SHIFT_TYPES={pranzo:"Pranzo",pomeriggio:"Pomeriggio",cena:"Cena",altro:"Altro orario"};
function shiftType(x){const a=toMin(x.start),d=shiftMinutes(x);if(a==null||d>7*60)return "altro";if(a<300)return "cena";const e=a+d;if(e<=990)return "pranzo";if(e<=1170)return "pomeriggio";return "cena"}
const legendHtml=()=>'<div class="legend" aria-label="Legenda turni">'+Object.entries(SHIFT_TYPES).map(([k,l])=>'<span><i class="sw t-'+k+'"></i>'+l+'</span>').join("")+'</div>';
const isIndip=p=>!!p&&p.status==="indipendente";
function shiftCost(x,p){if(!p)return 0;return isIndip(p)?(+p.rate||0):shiftHours(x)*(+p.rate||0)}
function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function weekKey(monday){const th=new Date(monday);th.setDate(th.getDate()+3);const y=th.getFullYear();const m1=mondayOf(new Date(y,0,4));const w=1+Math.round((monday-m1)/604800000);return y+"-W"+String(w).padStart(2,"0")}
function mondayFromKey(k){const p=/^(\d{4})-W(\d{2})$/.exec(k);if(!p)return null;const d=mondayOf(new Date(+p[1],0,4));d.setDate(d.getDate()+(+p[2]-1)*7);return d}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}

/* ---------- salvataggio su Supabase: una sincronizzazione alla volta per blocco ---------- */
const jobs={};
const busy=key=>jobs[key]&&(jobs[key].busy||jobs[key].dirty);
const pending=()=>Object.values(jobs).some(j=>j.busy||j.dirty);
function enqueue(key,fn){
  const j=jobs[key]||(jobs[key]={busy:false,dirty:false});
  j.dirty=true;j.fn=fn;if(!j.busy)runJob(key,j);
}
async function runJob(key,j){
  j.busy=true;setStatus("warn","Salvataggio…");
  while(j.dirty){
    j.dirty=false;
    let tries=0;
    for(;;){
      try{await j.fn();break}
      catch(e){console.error(e);tries++;
        if(tries<3&&navigator.onLine){await new Promise(r=>setTimeout(r,800*tries));continue}
        j.busy=false;setStatus("crit",navigator.onLine?"Salvataggio non riuscito: ricarica la pagina":"Sei offline: le ultime modifiche non sono salvate");return;}
    }
  }
  j.busy=false;if(!pending()){setStatus("ok","Tutto salvato");schedulePush()}
}
const idle=async key=>{while(busy(key))await new Promise(r=>setTimeout(r,120))};
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parseYmd=v=>{const [y,m,d]=String(v).slice(0,10).split("-").map(Number);return new Date(y,m-1,d)};

function saveWeek(k){
  if(readOnly||!sb)return;
  enqueue("w:"+k,async()=>{
    await idle("cfg");   // i dipendenti nuovi devono esistere prima dei loro turni
    const mon=mondayFromKey(k),from=ymd(mon),to=ymd(addDays(mon,6));
    const local=(weeks[k]||[]).filter(x=>staffById(x.staffId)&&srvStaff[x.staffId]).map(x=>shiftRow(k,x));
    const keep=new Set(local.map(r=>r.id));
    const changed=local.filter(r=>srvShifts[r.id]!==JSON.stringify(r));
    const removed=Object.keys(srvShifts).filter(id=>{const r=JSON.parse(srvShifts[id]);return r.day>=from&&r.day<=to&&!keep.has(id)});
    if(changed.length){const {error}=await sb.from("shifts").upsert(changed);if(error)throw error;changed.forEach(r=>srvShifts[r.id]=JSON.stringify(r))}
    if(removed.length){const {error}=await sb.from("shifts").delete().in("id",removed);if(error)throw error;removed.forEach(id=>delete srvShifts[id])}
  });
}

}

function slotFits(slot,x){if(!slot||slot==="tutto")return true;if(slot==="no")return false;return shiftType(x)===slot}
const pendingCount=()=>reqs.filter(r=>r.status==="attesa"&&staffById(r.staffId)).length+swaps.filter(w=>w.status==="attesa_admin"&&staffById(w.from)&&staffById(w.to)).length;

// ferie in giorni lavorativi con regime fisso (es. 5 su 7): settimane piene × regime + giorni restanti (al massimo il regime)
const workDaysIn=(a,b)=>{const n=dayCount(a,b),w=Math.min(7,Math.max(1,Math.round(+S().workDays||5)));return Math.floor(n/7)*w+Math.min(n%7,w)};
const wdLabel=(a,b)=>{const n=dayCount(a,b),w=workDaysIn(a,b);return '<b>'+w+(w===1?' giorno lavorativo':' giorni lavorativi')+'</b>'+(n!==w?' <span class="sub2">('+n+' di calendario)</span>':'')};
const fmtDayW=d=>DAYS[(d.getDay()+6)%7]+" "+fmtDay(d);
function fmtRange(a,b){return a===b?fmtDayW(parseYmd(a)):fmtDayW(parseYmd(a))+" – "+fmtDayW(parseYmd(b))}
function fmtStamp(v){const d=new Date(v);if(!v||isNaN(d))return "";return fmtDay(d)+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
// stato di una persona in un giorno della settimana mostrata: assenze, disponibilità e conflitti con i turni
function dayInfo(p,d,list,noCp){
  const ds=ymd(addDays(curMonday,d)),offs=offOn(p.id,ds),slot=p.status==="studente"?availOn(p.id,ds):"";
  let cls="",badges="";const warns=[];
  for(const r of offs){
    badges+='<span class="cbadge '+(r.status==="approvata"?"off-ok":"off-wait")+'" title="'+esc(KINDS[r.kind]+(r.status==="approvata"?" approvate":" richieste, in attesa")+(r.note?": "+r.note:""))+'">'+KINDS[r.kind]+(r.status==="approvata"?"":" ?")+'</span>';
    if(list.length){if(r.status==="approvata"){cls="crit";warns.push(p.name+" è in "+(r.kind==="ferie"?"ferie":"giorno libero")+" (approvato)")}else{if(cls!=="crit")cls="warn";warns.push(p.name+" ha chiesto "+(r.kind==="ferie"?"ferie":"un giorno libero")+" (in attesa)")}}
  }
  if(slot){
    badges+='<span class="cbadge av-'+slot+'" title="Disponibilità: '+SLOTS[slot]+'">'+(slot==="no"?"Non disp.":"Disp. "+SLOT_SHORT[slot].toLowerCase())+'</span>';
    if(list.some(x=>!slotFits(slot,x))){if(cls!=="crit")cls="warn";warns.push(slot==="no"?p.name+" ha detto di non essere disponibile":p.name+" è disponibile solo a "+(slot==="pranzo"?"pranzo":"cena"))}
  }
  for(const [lvl,msg] of noCp?[]:cpIssues(p,d,list)){warns.push(p.name+": "+msg);if(lvl==="crit")cls="crit";else if(cls!=="crit")cls="warn"}
  if(!cls&&!list.length&&offs.some(r=>r.status==="approvata"))cls="offday";
  return {cls,badges:badges?'<div class="cbadges">'+badges+'</div>':"",warns};
}
// regole orarie (CP 302 e regole generali): turni sovrapposti, durata minima, massimo giornaliero, ampiezza, riposo, giorno di riposo settimanale
function shiftsAbsOn(staffId,date,skipId){
  const k=weekKey(mondayOf(date)),di=(date.getDay()+6)%7,base=new Date(date.getFullYear(),date.getMonth(),date.getDate()).getTime();
  return (weeks[k]||[]).filter(x=>x.staffId===staffId&&x.day===di&&x.id!==skipId).map(x=>{const a=base+toMin(x.start)*60000;return {x,a,e:a+shiftMinutes(x)*60000}});
}
function cpIssues(p,d,list,opts){
  if(!p||p.status==="indipendente"||!list.length)return [];
  const s=S(),date=addDays(curMonday,d),base=new Date(date.getFullYear(),date.getMonth(),date.getDate()).getTime(),out=[];
  const iv=list.filter(x=>x.start&&x.end).map(x=>{const a=base+toMin(x.start)*60000;return {x,a,e:a+shiftMinutes(x)*60000}}).sort((u,v)=>u.a-v.a);
  if(!iv.length)return out;
  for(let i=1;i<iv.length;i++)if(iv[i].a<iv[i-1].e)out.push(["crit","turni sovrapposti"]);
  const minS=+s.minShift||0;
  for(const z of iv){const dur=(z.e-z.a)/3600000;if(minS&&dur<minS)out.push(["warn","turno di "+hrs(dur)+" (minimo "+minS+" h per turno)"])}
  const tot=iv.reduce((a,z)=>a+shiftHours(z.x),0);
  if(+s.maxDay&&tot>s.maxDay)out.push(["warn",hrs(tot)+" di lavoro nella giornata (massimo "+s.maxDay+" h)"]);
  const span=(Math.max(...iv.map(z=>z.e))-iv[0].a)/3600000;
  if(+s.maxSpan&&iv.length>1&&span>s.maxSpan)out.push(["warn","giornata di "+hrs(span)+" dal primo all'ultimo turno (massimo "+s.maxSpan+" h)"]);
  const prev=shiftsAbsOn(p.id,addDays(date,-1),opts&&opts.skipId);
  if(prev.length&&+s.minRest){const gap=(iv[0].a-Math.max(...prev.map(z=>z.e)))/3600000;if(gap>=0&&gap<s.minRest)out.push(["warn","solo "+hrs(gap)+" di riposo dal turno del giorno prima (minimo "+s.minRest+" h)"])}
  const next=shiftsAbsOn(p.id,addDays(date,1),opts&&opts.skipId);
  if(opts&&opts.modal&&next.length&&+s.minRest){const gap=(Math.min(...next.map(z=>z.a))-Math.max(...iv.map(z=>z.e)))/3600000;if(gap>=0&&gap<s.minRest)out.push(["warn","solo "+hrs(gap)+" di riposo prima del turno del giorno dopo (minimo "+s.minRest+" h)"])}
  const k=weekKey(mondayOf(date)),days=new Set((weeks[k]||[]).filter(x=>x.staffId===p.id&&!(opts&&x.id===opts.skipId)).map(x=>x.day));days.add(d);
  if(days.size>=7&&(d===6||(opts&&opts.modal)))out.push(["warn","nessun giorno di riposo nella settimana"]);
  return out;
}

/* ---------- calcoli ---------- */
function weekStats(key){
  const s=S();const shifts=(weeks[key]||[]).filter(x=>staffById(x.staffId));
  const per={};let totH=0,totC=0;const dayH=Array(7).fill(0),dayC=Array(7).fill(0);
  for(const x of shifts){
    const p=staffById(x.staffId);const h=shiftHours(x);const c=shiftCost(x,p);
    const a=x.day*1440+toMin(x.start);const e=a+shiftMinutes(x);
    const q=per[p.id]||(per[p.id]={h:0,c:0,n:0,day:Array(7).fill(0),list:[]});
    q.h+=h;q.c+=c;q.n++;q.day[x.day]+=h;q.list.push({a,e,day:x.day});
    totH+=h;totC+=c;dayH[x.day]+=h;dayC[x.day]+=c;
  }
  const alerts=[];const flags={};
  const flag=(id,d,lvl)=>{const k=id+":"+d;if(flags[k]!=="crit")flags[k]=lvl};
  for(const id in per){
    const p=staffById(id);const q=per[id];q.list.sort((u,v)=>u.a-v.a);
    for(let i=1;i<q.list.length;i++){if(q.list[i].a<q.list[i-1].e){alerts.push(["crit",p.name+": turni sovrapposti "+DAYS_LONG[q.list[i].day].toLowerCase()]);flag(id,q.list[i].day,"crit")}}
    const emp=p.status!=="indipendente";
    if(emp)q.day.forEach((h,d)=>{if(h>s.maxDay){alerts.push(["warn",p.name+": "+hrs(h)+" "+DAYS_LONG[d].toLowerCase()+" (soglia "+s.maxDay+" h)"]);flag(id,d,"warn")}});
    const days=[...new Set(q.list.map(z=>z.day))].sort((u,v)=>u-v);
    for(let i=1;emp&&i<days.length;i++){
      const prevEnd=Math.max(...q.list.filter(z=>z.day===days[i-1]).map(z=>z.e));
      const nextStart=Math.min(...q.list.filter(z=>z.day===days[i]).map(z=>z.a));
      const gap=(nextStart-prevEnd)/60;
      if(gap>=0&&gap<s.minRest){alerts.push(["warn",p.name+": solo "+hrs(gap)+" di riposo prima di "+DAYS_LONG[days[i]].toLowerCase()+" (soglia "+s.minRest+" h)"]);flag(id,days[i],"warn")}
    }
    const lim=weekLimit(p);if(lim>0&&q.h>lim)alerts.push(["warn",p.name+": "+hrs(q.h-lim)+" in più a settimana ("+hrs(q.h)+" su un massimo di "+lim+" h)"]);
  }
  const y=(mondayFromKey(key)||curMonday).getFullYear();
  for(const p of cfg.staff.filter(z=>z.status==="studente")){
    const used=studentHours(p,y);
    if(used>s.studentLimit)alerts.push(["crit",p.name+": "+hrs(used)+" da studente nel "+y+", oltre il limite di "+s.studentLimit+" h"]);
    else if(used>=s.studentLimit*0.9)alerts.push(["warn",p.name+": "+hrs(used)+" da studente nel "+y+" (limite "+s.studentLimit+" h)"]);
  }
  if(s.budget>0){
    if(totC>s.budget)alerts.push(["crit","Costo stimato "+eur(totC)+" oltre il budget di "+eur(s.budget)]);
    else if(totC>=s.budget*0.9)alerts.push(["warn","Costo stimato al "+Math.round(totC/s.budget*100)+"% del budget"]);
  }
  alerts.sort((u,v)=>(u[0]==="crit"?0:1)-(v[0]==="crit"?0:1));
  return {per,totH,totC,dayH,dayC,alerts,flags};
}
function studentHours(p,year){
  let h=+p.prior||0;
  for(const k in weeks){
    const m=mondayFromKey(k);if(!m)continue;
    for(const x of weeks[k]){if(x.staffId!==p.id)continue;if(addDays(m,x.day).getFullYear()===year)h+=shiftHours(x)}
  }
  return h;
}

function shiftsInRange(staffId,a,b){

function findShift(id){
  for(const k in weeks){const x=(weeks[k]||[]).find(y=>y.id===id);if(x)return {k,x,day:ymd(addDays(mondayFromKey(k),x.day))}}
  return null;
}
function shiftsOfOn(staffId,ds,skip){const out=[];for(const k in weeks){const mo=mondayFromKey(k);if(!mo)continue;for(const x of weeks[k])if(x.staffId===staffId&&x.id!==skip&&ymd(addDays(mo,x.day))===ds)out.push(x)}return out}
function overlapping(list,a,b){const x0=toMin(a),x1=x0+shiftMinutes({start:a,end:b});return list.filter(y=>{const y0=toMin(y.start),y1=y0+shiftMinutes(y);return y0<x1&&y1>x0})}
// controlli prima di approvare: chi riceve un turno è libero, presente, disponibile? i turni sono ancora quelli?
function swapWarnings(w){
  const out=[],A=staffById(w.from),B=staffById(w.to);if(!A||!B)return out;
  const check=(p,ds,a,b,skip)=>{
    const ov=overlapping(shiftsOfOn(p.id,ds,skip),a,b);if(ov.length)out.push(p.name+" ha già un turno che si sovrappone il "+fmtDayW(parseYmd(ds))+" ("+ov.map(y=>y.start+"–"+y.end).join(", ")+")");
    for(const r of offOn(p.id,ds))out.push(p.name+(r.status==="approvata"?" è in ":" ha chiesto ")+(r.kind==="ferie"?"ferie":"un giorno libero")+" il "+fmtDayW(parseYmd(ds))+(r.status==="approvata"?"":" (in attesa)"));
    if(p.status==="studente"){const sl=availOn(p.id,ds);if(sl&&!slotFits(sl,{start:a,end:b}))out.push(p.name+(sl==="no"?" ha detto di non essere disponibile":" è disponibile solo a "+(sl==="pranzo"?"pranzo":"cena"))+" il "+fmtDayW(parseYmd(ds)))}
  };
  if(w.status==="attesa_admin"||w.status==="attesa_collega"){
    const s1=findShift(w.shiftId);
    if(!s1||s1.x.staffId!==w.from||s1.x.start!==w.start||s1.x.end!==w.end||s1.day!==w.day)out.push("Il turno di "+A.name+" è stato modificato o eliminato nel frattempo");
    if(w.oday){const s2=findShift(w.otherId);if(!s2||s2.x.staffId!==w.to||s2.x.start!==w.ostart||s2.x.end!==w.oend||s2.day!==w.oday)out.push("Il turno di "+B.name+" è stato modificato o eliminato nel frattempo")}
    check(B,w.day,w.start,w.end,w.otherId);
    if(w.oday)check(A,w.oday,w.ostart,w.oend,w.shiftId);
  }
  return out;
}

async function decideSwap(id,approve,note){
  const w=swaps.find(x=>x.id===id);if(!w)return;
  setStatus("warn","Salvataggio…");
  while(pending())await new Promise(r=>setTimeout(r,120));   // prima salva eventuali modifiche al planning
  const {error}=await sb.rpc("admin_swap_decide",{p_id:id,p_approve:approve,p_note:note||""});
  if(error){
    console.error(error);setStatus("ok","Tutto salvato");
    const m=String(error.message||"");
    toast(/turni cambiati/.test(m)?"I turni sono cambiati nel frattempo: rifiuta il cambio":/non in attesa/.test(m)?"Il cambio non è più in attesa: ricarica":"Non riuscito, riprova");
    return;
  }
  const now=new Date().toISOString();
  if(approve){
    // aggiorna subito il planning in locale, come ha fatto il database
    const mv=(sid,to)=>{const f=findShift(sid);if(f){f.x.staffId=to;srvShifts[sid]=JSON.stringify(shiftRow(f.k,f.x))}};
    mv(w.shiftId,w.to);if(w.oday&&w.otherId)mv(w.otherId,w.from);
    const ids=[w.shiftId,w.otherId].filter(Boolean);
    swaps.forEach(o=>{if(o.id!==id&&["attesa_collega","attesa_admin"].includes(o.status)&&(ids.includes(o.shiftId)||ids.includes(o.otherId)))o.status="annullata"});
  }
  Object.assign(w,{status:approve?"approvata":"rifiutata",adminNote:(note||"").slice(0,200),decidedAt:now});
  setStatus("ok","Tutto salvato");render();toast(approve?"Cambio approvato: planning aggiornato":"Cambio rifiutato");
  notify({action:"swap",id});if(approve)schedulePush();
}

async function ensureAtt(force){
  if(!att.month)att.month=curMonth();
  if(!force&&att.ready===true&&Date.now()-att.at>120000)force=true;   // dati più vecchi di 2 minuti: ricarica
  if(att.loading||(!force&&att.ready!==null))return;
  att.loading=true;
  try{
    const [y,mo]=att.month.split("-").map(Number);
    const from=new Date(y,mo-1,0),to=new Date(y,mo,2);            // un giorno prima e due dopo: turni a cavallo della mezzanotte
    const [pu,pi,ki]=await Promise.all([
      fetchAll(()=>sb.from("punches").select("id,staff_id,staff_name,kind,at,source,kiosk_id,created_at,reason,voided,voided_at,void_reason").eq("org_id",orgId).gte("at",from.toISOString()).lt("at",to.toISOString()).order("at").order("id")),
      sb.rpc("admin_pin_status",{p_org:orgId}),
      sb.from("kiosks").select("id,name,token,active,created_at,last_seen,paired_at").eq("org_id",orgId).order("created_at")
    ]);
    if(pi.error)throw pi.error;if(ki.error)throw ki.error;
    att.punches=pu;att.pins={};for(const x of pi.data||[])att.pins[x.staff_id]=x.updated_at;att.kiosks=ki.data||[];
    att.ready=true;att.at=Date.now();
  }catch(e){console.warn("Badgeuse non disponibile",e);att.ready=false}
  att.loading=false;
  if(route()==="presenze"||route()==="impostazioni")render();

// coppie entrata/uscita per dipendente; ogni sessione appartiene al giorno dell'entrata
function attSessions(){
  const by={};
  for(const x of att.punches){if(x.voided)continue;const key=x.staff_id||("n:"+x.staff_name);(by[key]=by[key]||[]).push(x)}
  const out=[],nowMs=Date.now();
  for(const key in by){
    const list=by[key].sort((a,b)=>String(a.at).localeCompare(String(b.at)));let open=null;
    const push=(i,o)=>{const ref=i||o;out.push({key,staffId:ref.staff_id,name:(staffById(ref.staff_id)||{}).name||ref.staff_name,in:i,out:o,day:tYMD(ref.at)})};
    for(const x of list){
      if(x.kind==="in"){if(open)push(open,null);open=x}
      else{if(open){push(open,x);open=null}else push(null,x)}
    }
    if(open)push(open,null);
  }
  for(const s of out){
    s.live=!!(s.in&&!s.out&&nowMs-new Date(s.in.at)<20*3600e3);
    s.gross=s.in&&s.out?(new Date(s.out.at)-new Date(s.in.at))/3600e3:0;
  }
  return out;
}
function plannedOn(staffId,ds){
  const d=parseYmd(ds),k=weekKey(mondayOf(d)),di=(d.getDay()+6)%7;
  return (weeks[k]||[]).filter(x=>x.staffId===staffId&&x.day===di).sort((a,b)=>toMin(a.start)-toMin(b.start));
}
// righe giornaliere del mese: sessioni + pausa del planning + confronto con il pianificato
function attRows(){
  const ses=attSessions().filter(s=>s.day.slice(0,7)===att.month);
  const days={};
  for(const s of ses){const k=s.key+"|"+s.day;(days[k]=days[k]||{key:s.key,staffId:s.staffId,name:s.name,day:s.day,ses:[]}).ses.push(s)}
  // giorni pianificati senza nessuna timbratura (solo passati)
  const today=ymd(new Date());
  for(const k in weeks){const mo=mondayFromKey(k);if(!mo)continue;
    for(const x of weeks[k]){const ds=ymd(addDays(mo,x.day));if(ds.slice(0,7)!==att.month||ds>=today)continue;const p=staffById(x.staffId);if(!p)continue;
      const kk=x.staffId+"|"+ds;if(!days[kk])days[kk]={key:x.staffId,staffId:x.staffId,name:p.name,day:ds,ses:[]}}}
  const rows=Object.values(days);
  for(const r of rows){
    r.ses.sort((a,b)=>String((a.in||a.out).at).localeCompare(String((b.in||b.out).at)));
    const pl=r.staffId?plannedOn(r.staffId,r.day):[];
    r.planned=pl.reduce((a,x)=>a+shiftHours(x),0);
    let pause=0;const used=new Set();
    for(const s of r.ses){if(!s.in||!s.out)continue;
      const a=new Date(s.in.at),b=new Date(s.out.at);
      for(const x of pl){if(used.has(x.id))continue;const xs=parseYmd(r.day);xs.setMinutes(toMin(x.start));const xe=new Date(xs.getTime()+shiftMinutes(x)*60000);
        if(xs<b&&xe>a){used.add(x.id);pause+=(+x.pause||0)}}}
    r.pause=pause;
    r.gross=r.ses.reduce((a,s)=>a+s.gross,0);
    r.net=Math.max(0,r.gross-pause/60);
    r.flags=[];
    if(r.ses.some(s=>!s.in))r.flags.push(["crit","entrata mancante"]);
    if(r.ses.some(s=>s.in&&!s.out&&!s.live))r.flags.push(["crit","uscita mancante"]);
    if(r.ses.some(s=>s.live))r.flags.push(["ok","in servizio"]);
    if(!r.ses.length&&r.planned)r.flags.push(["warn","nessuna timbratura"]);
    if(r.ses.some(s=>(s.in&&s.in.source==="admin")||(s.out&&s.out.source==="admin")))r.flags.push(["warn","corretta"]);
  }
  return rows.sort((a,b)=>a.name.localeCompare(b.name)||a.day.localeCompare(b.day));
}

/* ---------- testi da copiare ---------- */
function waText(ids){
  const k=curKey(),m=curMonday;let out="Turni "+fmtDay(m)+" – "+fmtDay(addDays(m,6))+(cfg.venue?" · "+cfg.venue:"")+"\n";
  for(const id of ids){
    const p=staffById(id);const list=(weeks[k]||[]).filter(x=>x.staffId===id);
    if(ids.length>1){if(!list.length)continue;out+="\n*"+p.name+"*\n"}else out+="\n";
    for(let d=0;d<7;d++){const ds=list.filter(x=>x.day===d).sort((a,b)=>toMin(a.start)-toMin(b.start));
      if(ds.length)out+=DAYS[d]+" "+addDays(m,d).getDate()+": "+ds.map(x=>x.start+"–"+x.end+(x.note?" ("+x.note+")":"")).join(", ")+"\n";
      else if(ids.length===1)out+=DAYS[d]+" "+addDays(m,d).getDate()+": riposo\n";}
  }
  return out.trim();
}
function csvText(){
  const k=curKey(),rows=[["data","dipendente","reparto","statuto","inizio","fine","pausa_min","ore","costo_eur","nota"]];
  for(const x of (weeks[k]||[]).slice().sort((a,b)=>a.day-b.day||toMin(a.start)-toMin(b.start))){
    const p=staffById(x.staffId);if(!p)continue;const d=addDays(curMonday,x.day);const h=shiftHours(x);
    rows.push([d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"),p.name,ROLES[p.role],STATUSES[p.status],x.start,x.end,+x.pause||0,h.toFixed(2),shiftCost(x,p).toFixed(2),x.note||""]);
  }
  return rows.map(r=>r.map(v=>/[;"\n]/.test(String(v))?'"'+String(v).replace(/"/g,'""')+'"':v).join(";")).join("\n");
}

/* ---------- eventi ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");if(!t)return;
  const act=t.dataset.act,k=curKey();
  if(act==="close-bg"){if(e.target===t)closeModal();return}
  if(act==="close"){closeModal();return}
  if(act==="prev"){curMonday=addDays(curMonday,-7);render();return}
  if(act==="next"){curMonday=addDays(curMonday,7);render();return}
  if(act==="thisweek"){curMonday=mondayOf(new Date());dayIdx=(new Date().getDay()+6)%7;render();return}
  if(act==="day"){dayIdx=+t.dataset.d;render();return}
  if(act==="wa-team"){copyText(waText(cfg.staff.map(p=>p.id)));return}
  if(act==="csv"){copyText(csvText());return}
  if(act==="push-plan"){pushPlanModal();return}
  if(act==="push-send"){sendPlanPush(t);return}
  if(act==="copylink"){const p=staffById(t.dataset.id);if(p&&p.token)copyText(staffLink(p));return}
  if(act==="att-prev"||act==="att-next"||act==="att-now"){att.month=act==="att-now"?curMonth():shiftMonth(att.month||curMonth(),act==="att-prev"?-1:1);att.ready=null;render();return}
  if(act==="att-refresh"){ensureAtt(true);return}
  if(act==="att-punch"){attPunchModal(t.dataset.id);return}
  if(act==="att-csv"){attCsv();return}
  if(act==="att-log"){attLog();return}
  if(act==="kiosk-copy"){const k=att.kiosks.find(z=>z.id===t.dataset.id);if(k)copyText(badgeLink(k));return}
  if(act==="forgot"){forgotPassword();return}
  if(act==="logout"){sb.auth.signOut();return}
  if(act==="togglelink"){const p=staffById(t.dataset.id);if(p){p.linkActive=p.linkActive===false;saveCfg();render();toast(p.linkActive?"Link riattivato":"Link disattivato: "+p.name+" non vede più i turni")}return}
  if(act==="newlink"){confirmModal("Nuovo link","Il link attuale di "+(staffById(t.dataset.id)||{}).name+" smetterà di funzionare. Dovrai mandargli quello nuovo.","Crea nuovo link","do-newlink:"+t.dataset.id);return}
  if(act.startsWith("do-newlink:")){newLink(act.slice(11));closeModal();return}
  if(readOnly)return;
  if(act==="add"){shiftModal(null,t.dataset.staff,+t.dataset.day);return}
  if(act==="edit"){const x=(weeks[k]||[]).find(z=>z.id===t.dataset.id);if(x)shiftModal(x);return}
  if(act==="preset"){const p=PRESETS[+t.dataset.i];document.getElementById("sh-start").value=p[1];document.getElementById("sh-end").value=p[2];document.getElementById("sh-start").dispatchEvent(new Event("input",{bubbles:true}));return}
  if(act==="clip-clear"){clip=null;render();return}
  if(act==="sh-copy"){const x=(weeks[k]||[]).find(z=>z.id===t.dataset.id);closeModal();if(x)copyShift(x);return}
  if(act==="paste"){pasteShift(t.dataset.staff,+t.dataset.day);return}
  if(act==="copyday"){const d=+t.dataset.day;const list=(weeks[k]||[]).filter(x=>x.day===d&&staffById(x.staffId));if(!list.length){toast("Nessun turno da copiare");return}
    clip={type:"day",label:DAYS_LONG[d]+" "+addDays(curMonday,d).getDate(),shifts:list.map(x=>({staffId:x.staffId,start:x.start,end:x.end,pause:+x.pause||0,note:x.note||""}))};render();toast(clip.label+" copiato");return}
  if(act==="pasteday"){pasteDay(+t.dataset.day);return}
  if(act==="pz"){const el=document.getElementById("sh-pause");el.value=t.dataset.v;el.dispatchEvent(new Event("input",{bubbles:true}));return}
  if(act==="applypause"){const v=S().defaultPause||0;let n=0;weeks[k]=(weeks[k]||[]).map(x=>{if(v<shiftMinutes(x)){n++;return {...x,pause:v}}return x});saveWeek(k);render();toast("Pausa di "+v+" min applicata a "+n+" turni");return}
  if(act==="sh-save"){
    const g=id=>document.getElementById(id).value;
    const x={id:t.dataset.id||uid(),staffId:g("sh-staff"),day:+g("sh-day"),start:g("sh-start"),end:g("sh-end"),pause:Math.max(0,+g("sh-pause")||0),note:g("sh-note").trim()};
    if(toMin(x.start)==null||toMin(x.end)==null){document.getElementById("sh-err").textContent="Inserisci ora di inizio e di fine.";return}
    if(x.start===x.end){document.getElementById("sh-err").textContent="Inizio e fine non possono coincidere.";return}
    if(x.pause>=shiftMinutes(x)){document.getElementById("sh-err").textContent="La pausa è più lunga del turno.";return}
    const arr=(weeks[k]||[]).filter(z=>z.id!==x.id);arr.push(x);weeks[k]=arr;saveWeek(k);closeModal();render();return;
  }
  if(act==="sh-del"){weeks[k]=(weeks[k]||[]).filter(z=>z.id!==t.dataset.id);saveWeek(k);closeModal();render();return}
  if(act==="copyprev"){
    const pk=weekKey(addDays(curMonday,-7));const src=(weeks[pk]||[]).filter(x=>staffById(x.staffId));
    if(!src.length){toast("La settimana precedente è vuota");return}
    if((weeks[k]||[]).length){confirmModal("Copia settimana precedente","Questa settimana ha già "+weeks[k].length+" turni. Vuoi sostituirli con i "+src.length+" turni della settimana precedente?","Sostituisci","do-copyprev");return}
    doCopyPrev();return;
  }
  if(act==="do-copyprev"){doCopyPrev();closeModal();return}
  if(act==="rq-ok"){decide(t.dataset.id,"approvata","");return}
  if(act==="rq-no"){rejectModal(t.dataset.id);return}
  if(act==="rq-no-do"){const v=(document.getElementById("rq-reason")||{}).value||"";closeModal();decide(t.dataset.id,"rifiutata",v.trim());return}
  if(act==="rq-del"){const r=reqs.find(x=>x.id===t.dataset.id),p=r&&staffById(r.staffId);confirmModal("Elimina richiesta","Eliminare definitivamente "+(r?KINDS[r.kind].toLowerCase():"la richiesta")+(p?" di "+p.name:"")+"?","Elimina","do-rqdel:"+t.dataset.id);return}
  if(act.startsWith("do-rqdel:")){deleteReq(act.slice(9));closeModal();return}
  if(act==="rq-new"){absenceModal();return}
  if(act==="sw-ok"){decideSwap(t.dataset.id,true,"");return}
  if(act==="att-add"){attAddModal(t.dataset.staff||"",t.dataset.kind||"in",t.dataset.day||"");return}
  if(act==="att-add-do"){attAddDo();return}
  if(act==="att-void-do"){attVoidDo(t.dataset.id);return}
  if(act==="pin-set"){pinModal(t.dataset.id);return}
  if(act==="pin-gen"){const i=document.getElementById("pin-v");let v;do{v=String(Math.floor(Math.random()*10000)).padStart(4,"0")}while(/^(\d)\1{3}$|1234|4321/.test(v));if(i)i.value=v;return}
  if(act==="pin-save"){pinSave(t.dataset.id);return}
  if(act==="pin-del"){const p=staffById(t.dataset.id);confirmModal("Rimuovi PIN","Rimuovere il PIN di "+(p?p.name:"")+"? Non potrà più timbrare finché non ne imposti uno nuovo.","Rimuovi","do-pindel:"+t.dataset.id);return}
  if(act.startsWith("do-pindel:")){pinDel(act.slice(10));closeModal();return}
  if(act==="kiosk-new"){kioskModal();return}
  if(act==="kiosk-new-do"){kioskNew();return}
  if(act==="kiosk-toggle"){kioskToggle(t.dataset.id);return}
  if(act==="kiosk-unpair"){confirmModal("Scollega tablet","Il tablet attuale smetterà di funzionare. Poi apri il link sul nuovo tablet: sarà il primo dispositivo ad aprirlo a restare collegato.","Scollega","do-unpair:"+t.dataset.id);return}
  if(act.startsWith("do-unpair:")){kioskUnpair(act.slice(10));closeModal();return}
  if(act==="sw-no"){swapRejectModal(t.dataset.id);return}
  if(act==="sw-no-do"){const v=(document.getElementById("sw-reason")||{}).value||"";closeModal();decideSwap(t.dataset.id,false,v.trim());return}
  if(act==="sw-del"){const w=swaps.find(x=>x.id===t.dataset.id);confirmModal("Elimina cambio","Eliminare questo cambio dallo storico? I turni non cambiano.","Elimina","do-swdel:"+t.dataset.id);return}
  if(act.startsWith("do-swdel:")){deleteSwap(act.slice(9));closeModal();return}
  if(act==="rq-add"){addAbsence();return}
  if(act==="newstaff"){staffModal(null,t.dataset.status);return}
  if(act==="editstaff"){staffModal(staffById(t.dataset.id));return}
  if(act==="st-save"){
    const g=id=>document.getElementById(id).value;const name=g("st-name").trim();
    if(!name){document.getElementById("st-err").textContent="Inserisci il nome.";return}
    const p={id:t.dataset.id||uid(),name,role:g("st-role"),status:g("st-status"),rate:Math.max(0,+g("st-rate")||0),contract:g("st-status")==="fisso"?Math.max(0,+g("st-contract")||0):0,maxHours:Math.max(0,+g("st-max")||0),prior:g("st-status")==="studente"?Math.max(0,+g("st-prior")||0):0};
    const i=cfg.staff.findIndex(z=>z.id===p.id);if(i>=0)cfg.staff[i]=p;else cfg.staff.push(p);
    saveCfg();closeModal();render();return;
  }
  if(act==="st-del"){const p=staffById(t.dataset.id);confirmModal("Elimina dipendente","Eliminare "+(p?p.name:"")+"? Verranno eliminati anche tutti i suoi turni.","Elimina","do-stdel:"+t.dataset.id);return}
  if(act.startsWith("do-stdel:")){const id=act.slice(9);cfg.staff=cfg.staff.filter(z=>z.id!==id);saveCfg();closeModal();render();return}
});
function doCopyPrev(){const k=curKey(),pk=weekKey(addDays(curMonday,-7));weeks[k]=(weeks[pk]||[]).filter(x=>staffById(x.staffId)).map(x=>({...x,id:uid()}));saveWeek(k);render();toast("Turni copiati")}
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.classList&&t.classList.contains("maxin")&&!readOnly){const p=staffById(t.dataset.id);if(p){p.maxHours=Math.max(0,+t.value||0);saveCfg();render()}return}
  if(!t.id||!t.id.startsWith("set-")||readOnly)return;
  const key=t.id.slice(4);
  if(key==="venue"){cfg.venue=t.value.trim();}
  else{let v=+t.value;if(!(v>=0)){t.value=S()[key];return}
    if(key==="workDays")v=Math.min(7,Math.max(1,Math.round(v)));if(key==="reminderHour")v=Math.min(22,Math.round(v));
    t.value=v;cfg.settings={...S(),[key]:v}}
  saveCfg();render();
});
document.addEventListener("submit",async e=>{
  e.preventDefault();const f=e.target;
  if(f.id==="pwform"){const np=document.getElementById("np").value;const {error}=await sb.auth.updateUser({password:np});
    if(error){authMsg=error.message;render();return}recovery=false;authMsg="";toast("Password aggiornata");if(session)start();else render();return}
  if(f.id!=="loginform")return;
  const btn=e.submitter||f.querySelector("[data-mode=in]");const em=document.getElementById("em").value.trim(),pw=document.getElementById("pw").value;
  f.querySelectorAll("button").forEach(b=>b.disabled=true);
  if(btn.dataset.mode==="up"){
    const {data,error}=await sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.origin+location.pathname}});
    if(error)authMsg=traduci(error.message);else if(!data.session)authMsg="Account creato. Apri l'email di conferma che ti abbiamo mandato, poi torna qui e accedi.";else authMsg="";
  }else{
    const {error}=await sb.auth.signInWithPassword({email:em,password:pw});
    authMsg=error?traduci(error.message):"";
  }
  render();
});
function traduci(m){
  if(/Invalid login/i.test(m))return "Email o password non corretti.";
  if(/Email not confirmed/i.test(m))return "Devi prima confermare l'email: controlla la posta.";
  if(/already registered/i.test(m))return "Esiste già un account con questa email: premi Accedi.";
  if(/Password should be/i.test(m))return "La password deve avere almeno 8 caratteri.";
  return m;
}
document.addEventListener("keydown",e=>{
  const modal=!!document.querySelector(".overlay");
  if(e.key==="Escape"){if(modal)closeModal();else if(clip){clip=null;render()}return}
  const a=document.activeElement;
  if((e.key==="Enter"||e.key===" ")&&a&&a.tagName==="DIV"&&a.classList.contains("chip")){e.preventDefault();a.click();return}
  if(modal||readOnly||!(e.ctrlKey||e.metaKey)||!a)return;
  const kk=e.key.toLowerCase();
  if(kk==="c"&&a.classList.contains("chip")){const x=(weeks[curKey()]||[]).find(z=>z.id===a.dataset.id);if(x){e.preventDefault();copyShift(x)}}
  else if(kk==="v"&&a.dataset&&a.dataset.staff&&clip&&clip.type==="shift"){e.preventDefault();pasteShift(a.dataset.staff,+a.dataset.day)}
});
document.addEventListener("dragstart",e=>{
  const c=e.target.closest&&e.target.closest('.chip[draggable="true"]');if(!c||readOnly)return;
  dragId=c.dataset.id;try{e.dataTransfer.setData("text/plain",dragId);e.dataTransfer.effectAllowed="copyMove"}catch(_){}
  c.classList.add("dragging");
});
document.addEventListener("dragend",()=>{dragId=null;document.querySelectorAll(".dragging,.dropping").forEach(el=>el.classList.remove("dragging","dropping"))});
document.addEventListener("dragover",e=>{
  if(!dragId)return;const td=e.target.closest&&e.target.closest("td.cell[data-staff]");if(!td)return;
  e.preventDefault();try{e.dataTransfer.dropEffect=e.shiftKey?"move":"copy"}catch(_){}
  document.querySelectorAll("td.dropping").forEach(el=>{if(el!==td)el.classList.remove("dropping")});td.classList.add("dropping");
});
document.addEventListener("drop",e=>{
  const td=e.target.closest&&e.target.closest("td.cell[data-staff]");if(!dragId||!td)return;
  e.preventDefault();const k=curKey(),src=(weeks[k]||[]).find(z=>z.id===dragId);dragId=null;
  if(!src){render();return}
  const staffId=td.dataset.staff,day=+td.dataset.day;
  if(src.staffId===staffId&&src.day===day){render();return}
  if(e.shiftKey){src.staffId=staffId;src.day=day;saveWeek(k);render();toast("Turno spostato");return}
  if(addShiftTo(k,staffId,day,src)){saveWeek(k);render();toast("Turno copiato")}else{render();toast("Questo turno c'è già")}
});
window.addEventListener("hashchange",render);
let lastMobile=isMobile();
window.addEventListener("resize",()=>{if(isMobile()!==lastMobile){lastMobile=isMobile();render()}});

/* ---------- avvio ---------- */
async function start(){
  if(starting)return;starting=true;
  try{
    mode="loading";render();setStatus("warn","Caricamento…");
    const {data,error}=await sb.rpc("ensure_org");if(error)throw error;
    orgId=data;await loadAll();mode="db";render();setStatus("ok","Tutto salvato");refreshPush();
  }catch(e){console.error(e);mode="db";setStatus("crit","Impossibile caricare i dati: controlla la connessione e ricarica");render()}
  finally{starting=false}
}
(async()=>{
  const C=window.RUSH_CONFIG||{};
  if(!C.supabaseUrl||!C.supabaseAnonKey||/INSERISCI/.test(C.supabaseUrl+C.supabaseAnonKey)||!window.supabase){mode="setup";setStatus("crit","Da configurare");render();return}
  sb=window.supabase.createClient(C.supabaseUrl,C.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  sb.auth.onAuthStateChange((ev,s)=>{
    session=s;
    if(ev==="PASSWORD_RECOVERY"){recovery=true;mode="login";render();return}
    if(ev==="SIGNED_OUT"){orgId=null;cfg={venue:"",staff:[],settings:{...DEFAULT_SETTINGS}};weeks={};reqs=[];avail={};availWeeks={};reqReady=false;swaps=[];swapReady=false;att={ready:null,loading:false,month:"",punches:[],pins:{},kiosks:[],at:0};mode="login";authMsg="";setStatus("ok","");render();return}
    if((ev==="SIGNED_IN"||ev==="INITIAL_SESSION")&&s&&!orgId&&!recovery)setTimeout(start,0);
  });
  const {data}=await sb.auth.getSession();session=data.session;
  if(!session&&!recovery){mode="login";setStatus("ok","");render()}
})();
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"&&mode==="db"&&orgId&&!pending()&&!document.querySelector(".overlay")&&Date.now()-lastLoad>60000){
    loadAll().then(render).catch(()=>{});
  }
});
if("serviceWorker" in navigator&&location.protocol==="https:")window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
