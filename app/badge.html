<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#14161b">
<meta name="robots" content="noindex">
<meta name="mobile-web-app-capable" content="yes">
<title>Rush · Badgeuse</title>
<link rel="manifest" href="manifest-badge.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%2314161b'/%3E%3Cpath d='M136.10,166.90 L334.10,166.90 L309.90,208.70 L111.90,208.70Z' fill='%23ff5a1f' fill-opacity='1'/%3E%3Cpath d='M191.10,235.10 L422.10,235.10 L397.90,276.90 L166.90,276.90Z' fill='%23ff7d4d' fill-opacity='1'/%3E%3Cpath d='M114.10,303.30 L279.10,303.30 L254.90,345.10 L89.90,345.10Z' fill='%23ffa27c' fill-opacity='1'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@1,9..144,900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf7f1; --surface:#ffffff; --ink:#2b2420; --muted:#776c63; --line:#ebe3d6;
  --accent:#c8412b; --accent-ink:#ffffff; --basil:#3d8b4f; --oil:#e0ac34;
  --crit:#b42318; --crit-soft:#fde3df; --ok:#3d8b4f; --ok-soft:#e8f4eb; --warn:#946500; --warn-soft:#fdf2d2;
  --sala:#6f8a9c; --cucina:#9c7f63; --bar:#9a7ea0;
  --font-display:"Fraunces",Georgia,"Times New Roman",serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:17px/1.4 var(--font-body);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;touch-action:manipulation;overscroll-behavior:none}
button{font:inherit;color:inherit;touch-action:manipulation}
header{background:var(--surface);padding:max(12px,env(safe-area-inset-top)) 20px 0}
header::after{content:"";display:block;height:14px;margin:12px -20px 0;background:linear-gradient(90deg,rgba(200,65,43,.5) 50%,transparent 0) 0 0/14px 14px,linear-gradient(rgba(200,65,43,.5) 50%,transparent 0) 0 0/14px 14px,var(--surface)}
.top{display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-family:var(--font-display);font-size:34px;font-weight:900;font-style:italic;color:var(--accent);margin:0;line-height:1}
.venue{color:var(--muted);font-size:16px;padding-left:12px;border-left:1px solid var(--line)}
.clock{margin-left:auto;text-align:right}
.clock b{font-family:var(--font-mono);font-size:40px;line-height:1;letter-spacing:-.02em;display:block}
.clock span{font-size:14px;color:var(--muted)}
.fs{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:42px;height:42px;font-size:18px;cursor:pointer;color:var(--muted)}
main{padding:20px;max-width:1200px;margin:0 auto}
.hint{font-size:20px;font-weight:700;margin:0 0 4px;font-family:var(--font-display)}
.sub{color:var(--muted);font-size:15px;margin:0 0 18px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--muted)}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--oil)} .dot.crit{background:var(--crit)}
.net{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.group{margin:0 0 18px}
.group h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.person{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:16px 14px;text-align:left;cursor:pointer;min-height:84px;display:grid;gap:6px;align-content:center;box-shadow:0 2px 0 var(--line)}
.person b{font-size:20px;font-weight:800;line-height:1.15;word-break:break-word}
.person small{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.person.in{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 2px 0 #b9dcc2}
.person.in small{color:var(--ok);font-weight:700}
.person:disabled{opacity:.5;cursor:not-allowed}
.person:active:not(:disabled){transform:translateY(1px);box-shadow:none}
.overlay{position:fixed;inset:0;background:rgba(43,36,32,.45);display:grid;place-items:center;padding:16px;z-index:10}
.sheet{background:var(--surface);border-radius:22px;padding:22px;width:min(420px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25);text-align:center}
.sheet h3{font-family:var(--font-display);font-size:30px;margin:0}
.sheet .what{color:var(--muted);margin:4px 0 14px}
.dots{display:flex;gap:14px;justify-content:center;margin:6px 0 16px}
.dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink);display:block}
.dots i.on{background:var(--ink)}
.dots.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:68px;border-radius:14px;border:1px solid var(--line);background:#fffdf9;font-size:28px;font-weight:800;cursor:pointer;box-shadow:0 2px 0 var(--line)}
.pad button:active{transform:translateY(1px);box-shadow:none;background:var(--bg)}
.pad .fn{font-size:16px;font-weight:700;color:var(--muted)}
.msg{min-height:24px;font-weight:700;margin:-6px 0 10px;font-size:16px}
.msg.err{color:var(--crit)}
.result{width:min(520px,100%);padding:34px 26px}
.result .big{font-size:64px;line-height:1;margin-bottom:6px}
.result h3{font-size:34px}
.result p{font-size:20px;margin:10px 0 0}
.result.ok{border-top:10px solid var(--ok)}
.result.out{border-top:10px solid var(--accent)}
.result.bad{border-top:10px solid var(--crit)}
.cancel{margin-top:14px;border:0;background:transparent;color:var(--muted);font-weight:700;font-size:16px;cursor:pointer;padding:10px}
.empty{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:30px;text-align:center;color:var(--muted);font-size:18px}
.mono{font-family:var(--font-mono)}
@media (max-width:640px){.clock b{font-size:28px}.brand h1{font-size:28px}.venue{display:none}.grid{grid-template-columns:repeat(2,1fr)}}
/* ===== Rush · tema "back office" (sostituisce lo stile trattoria) ===== */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --ink:#111827; --muted:#6b7280; --line:#e5e7eb; --line2:#d1d5db;
  --accent:#ff5a1f; --accent-ink:#ffffff; --accent-soft:#fff1eb; --accent-dark:#e04812;
  --side:#14161b; --side-2:#1d2027; --side-ink:#e5e7eb; --side-muted:#8b929e;
  --basil:#16a34a; --oil:#f59e0b;
  --warn:#b45309; --warn-soft:#fef3c7; --crit:#dc2626; --crit-soft:#fee2e2; --ok:#16a34a; --ok-soft:#dcfce7;
  --sala:#2563eb; --sala-soft:#eff6ff; --cucina:#d97706; --cucina-soft:#fffbeb; --bar:#7c3aed; --bar-soft:#f5f3ff;
  --t-pranzo:#059669; --t-pranzo-soft:#ecfdf5; --t-pomeriggio:#d97706; --t-pomeriggio-soft:#fffbeb; --t-cena:#4f46e5; --t-cena-soft:#eef2ff; --t-altro:#64748b; --t-altro-soft:#f1f5f9;
  --font-display:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --radius:8px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.04);
}
body{font:14px/1.5 var(--font-body);letter-spacing:-.006em;font-feature-settings:"cv11","ss01"}
h1,h2,h3{font-family:var(--font-display);letter-spacing:-.02em}
.num,.chip,.mono{font-variant-numeric:tabular-nums}
/* intestazione scura, senza quadretti */
header.top{background:var(--side);color:var(--side-ink)}
header.top::after{display:none}
.brand .rush-mark{display:block;flex:none;margin-right:-9px}
.brand h1{font-family:"Fraunces",Georgia,"Times New Roman",serif;font-size:29px;font-weight:900;font-style:italic;letter-spacing:-.01em;line-height:1;color:#fff}
.brand .venue{color:var(--side-muted);border-left-color:#2c3039;font-size:13px}
.status{color:var(--side-muted)}
.dot.warn{background:var(--oil)}
/* bottoni */
.btn{border:1px solid var(--line2);border-radius:var(--radius);padding:7px 13px;font-weight:600;font-size:13.5px;background:var(--surface);box-shadow:0 1px 2px rgba(16,24,40,.05);transition:background .12s,border-color .12s}
.btn:hover{border-color:#9ca3af;background:#f9fafb}
.btn.primary{background:var(--accent);border-color:var(--accent);box-shadow:0 1px 2px rgba(16,24,40,.1);font-weight:600}
.btn.primary:hover{background:var(--accent-dark);border-color:var(--accent-dark);filter:none}
.btn.danger{color:var(--crit);border-color:#fecaca}
.icon-btn{border:1px solid var(--line2);border-radius:var(--radius);width:34px;height:34px;font-size:17px;background:var(--surface);box-shadow:0 1px 2px rgba(16,24,40,.05)}
.icon-btn:hover{background:#f9fafb;border-color:#9ca3af}
.btn:focus-visible,.icon-btn:focus-visible,.chip:focus-visible,.add:focus-visible,.dbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* titoli e pannelli */
.ph{font-size:24px;font-weight:700;letter-spacing:-.025em}
.weeknav h2{font-size:20px;font-weight:700;letter-spacing:-.02em}
.weeknav .sub{font-size:12.5px}
.panel{border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.panel>.hd{padding:12px 16px}
.panel>.hd h3{font-size:15px;font-weight:600;letter-spacing:-.01em}
.banner{border-radius:var(--radius);background:var(--warn-soft);border-color:#fde68a}
.empty{color:var(--muted);font-size:14px}
.empty a{color:var(--accent)}
.pill{font-size:11.5px;font-weight:600;text-transform:none;letter-spacing:0;padding:2px 8px;border-radius:6px}
.pill.ok{background:var(--ok-soft);color:#15803d}
.pill.mute{background:#f3f4f6;color:var(--muted);border:1px solid var(--line)}
.cnt{background:var(--accent);color:#fff;border-radius:999px;font-size:11px;font-weight:700}
/* KPI */
.tile{border:1px solid var(--line);border-top:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow)}
.tile:nth-child(n){border-top-color:var(--line)}
.tile .lbl{font-size:12px;text-transform:none;letter-spacing:0;font-weight:500;color:var(--muted)}
.tile .val{font-family:var(--font-display);font-size:28px;font-weight:700;letter-spacing:-.03em;margin-top:4px}
.bar{height:6px;border-radius:999px;background:#eef0f3}
.bar>i{background:var(--ok);border-radius:999px}
/* campi */
.field label{font-size:12.5px;font-weight:600;color:#374151}
.field input,.field select,.field textarea{border:1px solid var(--line2);border-radius:var(--radius);padding:8px 10px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.field input[type="time"]{font-family:var(--font-body);font-variant-numeric:tabular-nums}
.field input:focus-visible,.field select:focus-visible,.field textarea:focus-visible{outline:3px solid rgba(255,90,31,.18);outline-offset:0;border-color:var(--accent)}
/* finestre */
.overlay{background:rgba(17,24,39,.5);backdrop-filter:blur(2px)}
.modal{border-radius:12px;border:0;box-shadow:0 24px 48px -12px rgba(16,24,40,.25)}
.modal .hd{border-top:0;padding:16px 18px}
.modal .hd h3{font-size:17px;font-weight:700}
.modal .ft{background:#f9fafb}
.toast{background:#111827;border-radius:var(--radius)}
/* turni */
.chip{border-left-width:3px;border-radius:6px;font-family:var(--font-body);font-weight:600;font-size:12.5px}
.chip small{font-size:11px;color:var(--muted);font-weight:500}
.add{border-radius:6px;border-color:var(--line2)}
.add:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.add.paste{border-color:var(--oil);background:var(--warn-soft)}
.add.paste:hover{background:#fde68a;border-color:var(--oil)}
.mini{border-radius:6px;font-family:var(--font-body)}
.mini.on{border-color:var(--oil);background:var(--warn-soft)}
.tag{border-radius:6px;background:#f3f4f6}
.linkcell{font-family:var(--font-mono)}
.list th{font-size:11.5px;letter-spacing:.04em;font-weight:600}
.mono{font-family:var(--font-body);font-weight:600}
/* --- tablet badgeuse --- */
header{background:var(--side)}
header::after{display:none}
header{padding-bottom:14px}
.clock b{color:#fff;font-family:var(--font-body);font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:-.03em}
.clock span{color:var(--side-muted)}
.fs{background:var(--side-2);border-color:#2c3039;color:var(--side-muted);border-radius:var(--radius)}
.hint{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:-.02em}
.group h2{letter-spacing:.06em;font-weight:700}
.person{border-radius:12px;box-shadow:var(--shadow)}
.person b{font-weight:700;letter-spacing:-.01em}
.person.in{border-color:#86efac;background:var(--ok-soft);box-shadow:var(--shadow)}
.person.in small{color:#15803d}
.sheet{border-radius:16px}
.sheet h3{font-family:var(--font-display);font-weight:700;letter-spacing:-.02em}
.pad button{border-radius:10px;background:#f9fafb;border-color:var(--line);box-shadow:0 1px 2px rgba(16,24,40,.05);font-weight:700}
.pad button:active{background:#eef0f3}
.dots i{border-color:var(--ink)}
.result.ok{border-top-color:var(--ok)} .result.out{border-top-color:var(--accent)} .result.bad{border-top-color:var(--crit)}
.empty{border-radius:12px;box-shadow:var(--shadow)}
.mono{font-family:var(--font-body);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<header><div class="top">
  <div class="brand"><svg class="rush-mark" width="48" height="24" viewBox="0 0 48 24" aria-hidden="true"><defs><linearGradient id="rushg1" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#ff5a1f" stop-opacity="0"/><stop offset=".55" stop-color="#ff5a1f" stop-opacity=".85"/><stop offset="1" stop-color="#ff5a1f"/></linearGradient></defs><path d="M21.00,5.00 L47.00,5.00 L46.12,8.40 L20.12,8.40Z" fill="url(#rushg1)"/><path d="M3.54,10.60 L45.54,10.60 L44.66,14.00 L2.66,14.00Z" fill="url(#rushg1)"/><path d="M24.09,16.20 L44.09,16.20 L43.20,19.60 L23.20,19.60Z" fill="url(#rushg1)"/></svg><h1>Rush</h1><span class="venue" id="venue"></span></div>
  <div class="clock" aria-live="off"><b id="time">--:--</b><span id="date"></span></div>
  <button class="fs" id="fs" aria-label="Schermo intero" title="Schermo intero">⛶</button>
</div></header>
<main id="main"><div class="empty">Caricamento…</div></main>
<div id="layer"></div>
<script>
"use strict";
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TZ="Europe/Brussels";
const fT=new Intl.DateTimeFormat("it-BE",{timeZone:TZ,hour:"2-digit",minute:"2-digit",hour12:false});
const fD=new Intl.DateTimeFormat("it-IT",{timeZone:TZ,weekday:"long",day:"numeric",month:"long"});
const ROLES={sala:"Sala",cucina:"Cucina",bar:"Bar"};
let token=(location.hash||"").slice(1).trim();
if(/^[0-9a-f-]{36}$/i.test(token))store.set("rush-kiosk-token",token);else token=store.get("rush-kiosk-token")||"";
// codice segreto di questo dispositivo: il link funziona solo sul primo dispositivo che lo apre
let device=store.get("rush-kiosk-device:"+token)||"";
if(token&&!/^[0-9a-f]{64}$/.test(device)){const b=new Uint8Array(32);crypto.getRandomValues(b);device=[...b].map(x=>x.toString(16).padStart(2,"0")).join("");store.set("rush-kiosk-device:"+token,device)}
let sb=null, state=null, offset=0, online=true, busy=false, sel=null, pin="", closeTimer=null;

const now=()=>new Date(Date.now()+offset);           // orologio allineato al server
const hm=d=>fT.format(d);
function dur(ms){const m=Math.max(0,Math.round(ms/60000));return Math.floor(m/60)+" h "+String(m%60).padStart(2,"0")+" min"}
function tick(){const d=now();document.getElementById("time").textContent=hm(d);const t=fD.format(d);document.getElementById("date").textContent=t.charAt(0).toUpperCase()+t.slice(1)}
function main(html){document.getElementById("main").innerHTML=html}

async function load(){
  try{
    const t0=Date.now();
    const {data,error}=await sb.rpc("kiosk_state",{p_kiosk:token,p_device:device});
    if(error)throw error;
    if(data===null){state=null;main('<div class="empty">Questo tablet non è collegato a Rush.<br>Apri il link del tablet creato in Rush → Impostazioni → Badgeuse.</div>');return}
    if(data.error==="device"){state=null;main('<div class="empty"><b>Questo link è già collegato a un altro dispositivo.</b><br>La badgeuse funziona solo sul tablet del ristorante. Se questo è il tablet giusto, chiedi al responsabile di premere «Scollega tablet» in Rush → Impostazioni → Badgeuse, poi ricarica la pagina.</div>');return}
    const srv=new Date(data.now).getTime();offset=srv-(t0+Date.now())/2;
    state=data;online=true;render();
  }catch(e){online=false;if(state)render();else main('<div class="empty">Nessuna connessione a internet.<br>Riprovo tra pochi secondi…</div>')}
}
function render(){
  document.getElementById("venue").textContent=state.venue||"";
  const by={};for(const p of state.staff)(by[p.role]=by[p.role]||[]).push(p);
  let h='<div style="display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px"><div><p class="hint">Tocca il tuo nome per timbrare</p><p class="sub" style="margin:0">Entrata o uscita viene scelta da sola. Poi inserisci il tuo PIN di 4 cifre.</p></div><span style="margin-left:auto" class="net"><span class="dot '+(online?"ok":"crit")+'"></span>'+(online?"Collegato":"Senza connessione")+'</span></div>';
  if(!state.staff.length)h+='<div class="empty">Nessun dipendente in Rush.</div>';
  for(const r of ["sala","cucina","bar"]){if(!by[r])continue;
    h+='<section class="group"><h2>'+ROLES[r]+'</h2><div class="grid">'+by[r].map(p=>{const inn=!!p.in_since;
      return '<button class="person'+(inn?" in":"")+'" data-id="'+esc(p.id)+'"'+(p.has_pin?"":" disabled")+'><b>'+esc(p.name)+'</b><small>'+(p.has_pin?(inn?'<span class="dot ok"></span>In servizio dalle '+hm(new Date(p.in_since)):'Fuori servizio'):'PIN non impostato')+'</small></button>'}).join("")+'</div></section>';
  }
  main(h);
}
function sheet(html,cls){document.getElementById("layer").innerHTML='<div class="overlay" id="ov"><div class="sheet '+(cls||"")+'" role="dialog" aria-modal="true">'+html+'</div></div>'}
function closeSheet(){clearTimeout(closeTimer);sel=null;pin="";document.getElementById("layer").innerHTML=""}
function armClose(ms){clearTimeout(closeTimer);closeTimer=setTimeout(()=>{closeSheet();load()},ms)}
function pinSheet(msg,err){
  const p=state.staff.find(x=>x.id===sel);if(!p){closeSheet();return}
  const what=p.in_since?"Uscita":"Entrata";
  sheet('<h3>'+esc(p.name)+'</h3><div class="what">'+what+' · inserisci il tuo PIN</div><div class="dots" id="dots">'+[0,1,2,3].map(i=>'<i class="'+(i<pin.length?"on":"")+'"></i>').join("")+'</div><div class="msg'+(err?" err":"")+'" role="status">'+esc(msg||"")+'</div>'+
    '<div class="pad">'+[1,2,3,4,5,6,7,8,9].map(n=>'<button data-k="'+n+'">'+n+'</button>').join("")+'<button class="fn" data-k="x">Annulla</button><button data-k="0">0</button><button class="fn" data-k="b" aria-label="Cancella">⌫</button></div>');
  if(err){const d=document.getElementById("dots");d.classList.add("shake")}
  armClose(30000);
}
function resultSheet(kind,html,cls,ms){
  sheet('<div class="big" aria-hidden="true">'+kind+'</div>'+html,"result "+cls);armClose(ms||4500);
}
async function submit(){
  if(busy)return;busy=true;
  const p=state.staff.find(x=>x.id===sel),code=pin;
  try{
    const {data,error}=await sb.rpc("kiosk_punch",{p_kiosk:token,p_device:device,p_staff:sel,p_pin:code});
    if(error)throw error;
    if(data.error==="pin"){pin="";pinSheet("PIN errato, riprova",true);busy=false;return}
    if(data.error==="locked"){resultSheet("🔒",'<h3>Troppi tentativi</h3><p>Aspetta 15 minuti o chiedi al responsabile di reimpostare il PIN.</p>',"bad",6000)}
    else if(data.error==="double"){resultSheet("✓",'<h3>Hai appena timbrato</h3><p>'+(data.kind==="in"?"Entrata":"Uscita")+' registrata alle '+hm(new Date(data.at))+'.</p>',"ok",4000)}
    else if(data.error==="nopin"){resultSheet("!",'<h3>PIN non impostato</h3><p>Chiedi al responsabile.</p>',"bad",5000)}
    else if(data.error){resultSheet("!",'<h3>Tablet non collegato</h3><p>Chiedi al responsabile.</p>',"bad",6000)}
    else if(data.kind==="in"){resultSheet("👋",'<h3>Entrata alle '+hm(new Date(data.at))+'</h3><p>Buon lavoro, '+esc(data.name)+'!</p>',"ok")}
    else{resultSheet("✓",'<h3>Uscita alle '+hm(new Date(data.at))+'</h3><p>'+(data.since?"Sei stato in servizio "+dur(new Date(data.at)-new Date(data.since))+". ":"")+'A presto, '+esc(data.name)+'!</p>',"out")}
  }catch(e){
    online=false;
    resultSheet("✕",'<h3>Timbratura NON registrata</h3><p>Nessuna connessione a internet. Riprova tra poco; se il problema continua avvisa il responsabile.</p>',"bad",7000);
  }
  busy=false;
}
document.addEventListener("click",e=>{
  const b=e.target.closest(".person");
  if(b&&!b.disabled&&state){sel=b.dataset.id;pin="";pinSheet();return}
  const k=e.target.closest("[data-k]");
  if(k&&sel){const v=k.dataset.k;
    if(v==="x"){closeSheet();return}
    if(v==="b"){pin=pin.slice(0,-1);pinSheet();return}
    if(pin.length<4&&!busy){pin+=v;pinSheet();if(pin.length===4)submit()}
    return;
  }
  if(e.target.id==="ov"&&!busy){closeSheet();load()}
  if(e.target.id==="fs"){const d=document.documentElement;if(!document.fullscreenElement&&d.requestFullscreen)d.requestFullscreen().catch(()=>{});else if(document.exitFullscreen)document.exitFullscreen().catch(()=>{})}
});
document.addEventListener("keydown",e=>{if(!sel||busy)return;if(/^[0-9]$/.test(e.key)&&pin.length<4){pin+=e.key;pinSheet();if(pin.length===4)submit()}else if(e.key==="Backspace"){pin=pin.slice(0,-1);pinSheet()}else if(e.key==="Escape")closeSheet()});
// schermo sempre acceso, dove il browser lo permette
let lock=null;async function keepAwake(){try{if("wakeLock" in navigator&&document.visibilityState==="visible")lock=await navigator.wakeLock.request("screen")}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){keepAwake();load()}});
window.addEventListener("online",load);
window.addEventListener("hashchange",()=>location.reload());
(function(){
  tick();setInterval(tick,1000);
  const C=window.RUSH_CONFIG||{};
  if(!token){main('<div class="empty">Questo tablet non è ancora collegato.<br>In Rush vai su Impostazioni → Badgeuse e apri qui il link del tablet.</div>');return}
  if(!window.supabase||!C.supabaseUrl||/INSERISCI/.test(C.supabaseUrl)){main('<div class="empty">App non ancora configurata.</div>');return}
  sb=window.supabase.createClient(C.supabaseUrl,C.supabaseAnonKey,{auth:{persistSession:false,autoRefreshToken:false}});
  keepAwake();load();setInterval(()=>{if(!sel&&!busy)load()},30000);
})();
if("serviceWorker" in navigator&&location.protocol==="https:")window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
